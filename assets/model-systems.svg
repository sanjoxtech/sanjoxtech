<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="290" viewBox="0 0 1200 290" role="img" aria-labelledby="title desc">
<title id="title">Model Foundry, InferStack and FactoryOS</title><desc id="desc">Model lifecycle feeds serving, which feeds agent execution. Evaluation evidence informs the next model and harness experiment.</desc>
